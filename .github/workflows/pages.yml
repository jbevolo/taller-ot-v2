name: Deploy Pages shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Select preinstalled browser
        timeout-minutes: 1
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_path" ] || [ ! -x "$browser_path" ]; then
            echo "::error::No preinstalled Chrome/Chromium executable found; browser tests are required."
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Run browser tests
        timeout-minutes: 5
        run: npm run test:browser
      - name: Activate configured cloud build
        if: github.ref == 'refs/heads/main' && vars.TALLER_OT_SUPABASE_URL != '' && vars.TALLER_OT_EXPECTED_SUPABASE_URL != '' && secrets.TALLER_OT_SUPABASE_PUBLISHABLE_KEY != ''
        env:
          TALLER_OT_SUPABASE_URL: ${{ vars.TALLER_OT_SUPABASE_URL }}
          TALLER_OT_EXPECTED_SUPABASE_URL: ${{ vars.TALLER_OT_EXPECTED_SUPABASE_URL }}
          TALLER_OT_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.TALLER_OT_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Build disconnected public shell
        if: github.ref != 'refs/heads/main' || vars.TALLER_OT_SUPABASE_URL == '' || vars.TALLER_OT_EXPECTED_SUPABASE_URL == '' || secrets.TALLER_OT_SUPABASE_PUBLISHABLE_KEY == ''
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
