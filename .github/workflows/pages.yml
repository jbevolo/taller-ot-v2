name: Deploy Pages shell

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Select preinstalled browser
        timeout-minutes: 1
        shell: bash
        run: |
          browser_path="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser_path" ] || [ ! -x "$browser_path" ]; then
            echo "::error::No preinstalled Chrome/Chromium executable found; browser tests are required."
            exit 1
          fi
          echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=$browser_path" >> "$GITHUB_ENV"
      - name: Run browser tests
        timeout-minutes: 5
        run: npm run test:browser
      - name: Build Pages artifact
        id: build
        shell: bash
        run: |
          activation_ready=false
          if [ "${{ github.ref }}" = "refs/heads/main" ] \
            && [ -n "${{ vars.TALLER_OT_SUPABASE_URL }}" ] \
            && [ -n "${{ vars.TALLER_OT_EXPECTED_SUPABASE_URL }}" ] \
            && [ -n "${{ secrets.TALLER_OT_SUPABASE_PUBLISHABLE_KEY }}" ]; then
            activation_ready=true
          fi
          if [ "$activation_ready" = "true" ]; then
            echo "Building activated artifact for the configured project."
            TALLER_OT_SUPABASE_URL="${{ vars.TALLER_OT_SUPABASE_URL }}" \
            TALLER_OT_EXPECTED_SUPABASE_URL="${{ vars.TALLER_OT_EXPECTED_SUPABASE_URL }}" \
            TALLER_OT_SUPABASE_PUBLISHABLE_KEY="${{ secrets.TALLER_OT_SUPABASE_PUBLISHABLE_KEY }}" \
              npm run build
          else
            echo "Building disconnected artifact: activation inputs absent."
            npm run build
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
